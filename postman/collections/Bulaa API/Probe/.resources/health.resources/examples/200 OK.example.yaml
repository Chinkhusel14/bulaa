$kind: http-example
name: 200 OK
request:
  url: '{{baseUrl}}/health'
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: content-type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "ok": true,
        "service": "backend"
      }
